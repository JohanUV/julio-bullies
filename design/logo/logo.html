<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap">
<style>
  html,body{margin:0;background:transparent}
  body{font-family:"Anton",Impact,sans-serif}
  .board{position:relative;overflow:hidden}
  .mark{position:absolute}
  .mark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .mark img{position:absolute;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
  .word{position:absolute;text-align:center;line-height:.86;white-space:nowrap}
  .julio{font-family:"Anton",Impact,sans-serif;color:#f6f1ea;letter-spacing:.02em;
    text-shadow:0 6px 0 #3a1f10, 0 8px 24px rgba(0,0,0,.5)}
  .bullies{font-family:"Bebas Neue",Impact,sans-serif;color:#ff7a1a;letter-spacing:.28em;margin-left:.28em;
    text-shadow:0 4px 0 #3a1f10, 0 6px 18px rgba(0,0,0,.5)}
  /* vertical 1600x1800 */
  .v .board{width:1600px;height:1800px}
  .v .mark{left:100px;top:40px;width:1400px;height:1180px}
  .v .mark img{height:1150px;left:50%;top:40px;transform:translateX(-50%)}
  .v .word{left:0;right:0;top:1215px}
  .v .julio{font-size:360px}
  .v .bullies{font-size:170px;margin-top:6px}
  /* horizontal 2400x900 */
  .h .board{width:2400px;height:900px}
  .h .mark{left:40px;top:20px;width:1000px;height:860px}
  .h .mark img{height:840px;left:50%;top:14px;transform:translateX(-50%)}
  .h .word{left:1030px;right:40px;top:110px;text-align:left}
  .h .julio{font-size:410px}
  .h .bullies{font-size:200px;margin-top:8px}
  /* mark 1400x1400 */
  .m .board{width:1400px;height:1400px}
  .m .mark{left:0;top:0;width:1400px;height:1400px}
  .m .mark img{height:1330px;left:50%;top:40px;transform:translateX(-50%)}
  .m .word{display:none}
</style></head>
<body>
<div class="board">
  <div class="mark">
    <svg viewBox="0 0 1400 1180" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffb15c"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset="1" stop-color="#c94f05"/>
        </linearGradient>
        <filter id="brush" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="brush2" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency=".02 .05" numOctaves="2" seed="3" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="55" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <clipPath id="flag"><ellipse cx="690" cy="620" rx="600" ry="390" transform="rotate(-8 690 620)"/></clipPath>
      <g filter="url(#brush)">
        <ellipse cx="700" cy="640" rx="640" ry="420" fill="#1c1a17" transform="rotate(-8 700 640)"/>
      </g>
      <g filter="url(#brush2)">
        <g clip-path="url(#flag)" transform="rotate(-8 690 620)">
          <rect x="0" y="0" width="1400" height="620" fill="#FFD100"/>
          <rect x="0" y="620" width="1400" height="195" fill="#0A4EA2"/>
          <rect x="0" y="815" width="1400" height="400" fill="#E3242B"/>
        </g>
        <path d="M120 560 C 60 520, 40 600, 110 640" stroke="#FFD100" stroke-width="46" stroke-linecap="round" fill="none"/>
        <path d="M1270 520 C 1330 500, 1350 560, 1290 600" stroke="#FFD100" stroke-width="40" stroke-linecap="round" fill="none"/>
        <path d="M420 990 C 440 1030, 500 1040, 540 1010" stroke="#E3242B" stroke-width="34" stroke-linecap="round" fill="none"/>
      </g>
      <g filter="url(#brush)" opacity=".22">
        <ellipse cx="560" cy="470" rx="330" ry="160" fill="#fff8d6" transform="rotate(-12 560 470)"/>
      </g>
    </svg>
    <img src="dog-frontal.png" alt="">
  </div>
  <div class="word"><div class="julio">JULIO</div><div class="bullies">BULLIES</div></div>
</div>
<script>document.body.className = new URLSearchParams(location.search).get("v") || "v";</script>
</body></html>
